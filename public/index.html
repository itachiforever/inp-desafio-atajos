<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INP PLAY · Desafío de atajos</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="scene-art" aria-hidden="true"><div class="halo"></div><div class="screen-illustration"><div class="screen-top"><span></span><span></span><span></span></div><div class="code-line a"></div><div class="code-line b"></div><div class="code-line c"></div><div class="code-line d"></div><div class="code-symbol">⌘</div></div><div class="keyboard-illustration"></div><div class="orb orb-one"></div><div class="orb orb-two"></div></div><header><div class="brand">INP <span>PLAY</span><span class="brand-die">✦</span></div><h1>DESAFÍO DE ATAJOS</h1><p>Juego multijugador de informática · 3 turnos por jugador · 1 punto por acierto</p></header><section id="login" class="panel"><h2>¡Vamos a jugar!</h2><label>Tu nombre<input id="name" maxlength="24" placeholder="Nombre o alias"></label><button id="create">CREAR SALA</button><div class="or">— o entra en una sala —</div><label>Código de sala<input id="code" maxlength="6" placeholder="ABC123" autocomplete="off"></label><button id="join">ENTRAR</button></section><section id="game" hidden><div class="panel"><div class="row"><strong>SALA: <span id="roomCode"></span></strong><button class="secondary" id="copy">COPIAR CÓDIGO</button><button class="secondary" id="exitGame" type="button">SALIR DE LA PARTIDA</button></div><p id="message" aria-live="polite"></p><div class="game-layout"><aside class="players-zone"><h2>👥 JUGADORES</h2><div id="players"></div></aside><div class="play-zone"><div id="turnInfo"></div><div id="actions"></div></div></div></div></section><p id="error" role="alert"></p><footer>INP Formación · Juego educativo de prueba</footer></main><script src="/app.js" defer></script></body></html>
